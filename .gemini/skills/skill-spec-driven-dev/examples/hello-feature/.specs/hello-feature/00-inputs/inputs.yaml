requirements:
  - id: REQ-1
    source: 00-inputs/pm-requirements.md#requirements
    statement: "The CLI shall print 'Hello, <name>!' when invoked as 'hello <name>'."
    category: functional
    derived: false
    notes: ~

  - id: REQ-2
    source: 00-inputs/pm-requirements.md#error-handling
    statement: "When invoked without a name, the CLI shall print 'usage: hello <name>' and exit with status 2."
    category: functional
    derived: false
    notes: ~

non_functional_requirements:
